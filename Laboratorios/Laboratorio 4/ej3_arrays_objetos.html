<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        
        
        table {
            border-collapse: collapse;
            width: 70%;
            margin-top: 10px;
        }
        table th {
            background-color: #374151;
            color: white;
            padding: 10px 14px;
            text-align: left;
        }
        table td {
            padding: 8px 14px;
            border: 1px solid #ccc;
        }
        
        .aprobado {
            background-color: #1e9859;
        }
        .reprobado {
            background-color: #ac2d2d;
        }
       

        p#aprobados {
            color: #1e9859;
        }
        p#reprobados {
            color: #dd1515;
        }

        p#nombres {
            color: rgb(8, 63, 166);
        }
    </style>
</head>
<body>

    <h1>Ejercicio 3 </h1>

    <div id="tabla"></div>

    <br>
    <p id="resumen"></p>
    <p id="aprobados"></p>
    <p id="reprobados"></p>
    <p id="nombres"></p>

    <script>
        function Estudiante(nombre, n1, n2, n3) {
            this.nombre = nombre;
            this.nota1 = n1;
            this.nota2 = n2;
            this.nota3 = n3;
            }
            // ─── Métodos via Prototype ──────────────
            Estudiante.prototype.promedio = function() {
            return ((this.nota1 + this.nota2 + this.nota3) / 3).toFixed(2);
            };
            Estudiante.prototype.estado = function() {
            return parseFloat(this.promedio()) >= 51 ? 'Aprobado' : 'Reprobado';
            };
            // ─── Array de instancias ────────────────
            var estudiantes = [
            new Estudiante('Ana Lopez', 75, 82, 90),
            new Estudiante('Luis Rios', 40, 55, 48),
            new Estudiante('Maria Paz', 88, 92, 85),
            new Estudiante('Juan Abad', 60, 70, 65),
            new Estudiante('Sofia Cruz', 30, 45, 50)
            ];
            // ─── filter: aprobados ──────────────────
            var aprobados = estudiantes.filter(function(e) {
            return parseFloat(e.promedio()) >= 51;
            });

            var reprobados = estudiantes.filter(function(e) {
            return parseFloat(e.promedio()) < 51;
            });

             
          
            document.getElementById('aprobados').innerHTML =
            'Aprobados: ' + aprobados.length + ' de ' + estudiantes.length;
            document.getElementById('reprobados').innerHTML =
            'Reprobados: ' + reprobados.length + ' de ' + estudiantes.length;

            // ─── map: solo nombres ──────────────────
            var nombres = estudiantes.map(function(e) { return e.nombre; });

            document.getElementById('nombres').textContent = nombres.join(', ');
            // ─── forEach: construir tabla HTML ──────
            var html = '<table border=1><tr><th>Nombre</th><th>P1</th>'+ '<th>P2</th><th>P3</th><th>Prom</th><th>Estado</th></tr>';
            estudiantes.forEach(function(e) {
            var bg = e.estado()==='Aprobado' ? '#D1FAE5' : '#FEE2E2';
            html += '<tr style="background:' + bg + '">'
            + '<td>' + e.nombre + '</td>'
            + '<td>' + e.nota1 + '</td>'
            + '<td>' + e.nota2 + '</td>'
            + '<td>' + e.nota3 + '</td>'
            + '<td>' + e.promedio() + '</td>'
            + '<td>' + e.estado() + '</td></tr>';
            });
            html += '</table>';
            document.getElementById('tabla').innerHTML = html;
            // ─── JSON.stringify ─────────────────────
            console.log(JSON.stringify(estudiantes[0]));
    </script>
    
</body>
</html>
