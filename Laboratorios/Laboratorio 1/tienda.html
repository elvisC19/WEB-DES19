<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda</title>
    <link rel="stylesheet" href="estilos2.css">
</head>
<body>

    
    <header class="header">
        <div class="logo">
            <h2>Mi Tienda</h2>
        </div>

        <nav class="menu">
            <a href="#">Inicio</a>
            <a href="#">Productos</a>
            <a href="#">Contacto</a>
        </nav>
    </header>

    
    <main class="principal">
        <h1>Bienvenido a Nuestra Tienda</h1>
        <p>Encuentra los mejores productos al mejor precio.</p>
        <button>Comprar Ahora</button>
    </main>

    
    <section class="productos">

        <article class="tarjeta">
            <img src="img/Monitor.png" alt="Imagen de monitor">
            <h3>Monitor</h3>
            <p>Monitor de alta resolución</p>
            <button>Añadir al carrito</button>
        </article>

        <article class="tarjeta">
            <img src="img/mouse.jpg" alt="Imagen de mouse">
            <h3>Mouse</h3>
            <p>Control preciso y responsive</p>
            <button>Añadir al carrito</button>
        </article>

        <article class="tarjeta">
            <img src="img/teclado.jpg" alt="Imagen de teclado">
            <h3>Teclado</h3>
            <p>Escritura rápida y cómoda</p>
            <button>Añadir al carrito</button>
        </article>

    </section>

    
    <footer class="footer">
        <p>© 2026 Tienda </p>
    </footer>

    
</body>
</html>
