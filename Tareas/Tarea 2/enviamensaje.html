<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css">
    <title>Document</title>
</head>
<body>
<h1>Formulario de Contacto</h1>

    <p>Si deseas comunicarte conmigo, completa el siguiente formulario:</p>

    <hr>

    <img src="imagenes/Imagen2.png" alt="Imagen de contacto" class="imagen-centrada">

    <form action="" method="post">

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>
        <br><br>

        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo" required>
        <br><br>

        <label for="asunto">Asunto:</label>
        <input type="text" id="asunto" name="asunto">
        <br><br>

        <label for="mensaje">Mensaje:</label>
        <br>
        <textarea id="mensaje" name="mensaje" rows="5" cols="50"></textarea>
        <br><br>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpiar">

    </form>

    <hr>

    <a href="yo.html">Volver</a>

    
    
</body>
</html>
