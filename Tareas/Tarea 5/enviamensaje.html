<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <title>Envia un Mensaje</title>
</head>
<body>



    <main>

        <section class="contenido">
            <h2>Formulario de Contacto</h2>
            <p>Si deceas contactarme conmigo, completa ek suguiente formulario</p>
           <img src="imagenes/adios.jpg" alt="Imagen de contacto">

           <form action="" method="post">
            <div class="campo">
                <label for="nombre">nombre:</label>
                <input type="text" id="nombre" name="nombre">
            </div>

            <div class="campo">
                <label for="correo">Correo Electronico:</label>
                <input type="text" id="correo" name="correo">
                
            </div>

            <div class="campo">
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje"></textarea>
            </div>

            <div class="botones">
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpiar">
            </div>

           </form>
        </section>

        <aside>
            <h2>Otras formas de contactarme</h2>

                <li><strong>Correo:</strong>elvishcordova@gmail.com</li>

            </ul>
        </aside>

    </main>

</body>
</html>
