<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .amarillo{
            background-color:yellow ;
            width: 50px;
        }
    </style>
</head>
<body>

    <script>
        n=prompt("Introducir la cantidad de filas");
        m=prompt("Introducir la cantidad de columnas");
        document.write('<table border = "1" class="amarillo">');
        for(i=0;i<n;i++){
            document.write("<tr>");
                for(j=0;j<n;j++){
                    document.write("<td>&nbsp;</td>");

                }
                document.write("</tr>");
        
        }
        document.write("</table>");
        
    </script>
    
</body>
