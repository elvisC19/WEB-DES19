<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 1 - Tabla de colores 5x5</title>
<style>
    table { 
        border-collapse: collapse; 
        margin: 20px auto; 
        }

    td { 
        width: 50px; 
        height: 50px; 
        border: 1px solid #999; 
        cursor: pointer; 
        }

    .container { 
        text-align: center; 
    }
</style>
</head>
<body>

<div class="container">
  <h2>Tabla de colores </h2>
  <div id="contenedor-tabla"></div>
    <label>Color seleccionado:</label>
    <input type="color" id="selector-color" value="#ff9966">
    <span id="hex-color">#ff9966</span>

</div>

<script>
  
    contenedor = document.getElementById("contenedor-tabla");
    tabla = document.createElement("table");
 
        for ( i = 0; i < 5; i++) {
             fila = document.createElement("tr");
 
            for ( j = 0; j < 5; j++) {
                 celda = document.createElement("td");
 
                
                celda.onclick = function() {
                     color = document.getElementById("selector-color").value;
                    this.style.backgroundColor = color;
                };
 
                fila.appendChild(celda);
            }
 
            tabla.appendChild(fila);
        }
 
        contenedor.appendChild(tabla);
 
        
        document.getElementById("selector-color").oninput = function() {
            document.getElementById("hex-color").textContent = this.value;
        };

</script>
</body>
</html>
