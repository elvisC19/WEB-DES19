<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 5 </title>
    <style>
        body{
            font-family: Arial;
            background-color: #f0f0f0;
            text-align: center;
        }

        h1{
            margin-top: 30px;
        }

        #contenedor{
            width: 500px;
            margin: auto;
            margin-top: 40px;
            background-color: white;
            padding: 20px;
            border: 1px solid black;
            border-radius: 8px;
        }

        ul{
            list-style: disc;
        }

        li{
            width: 300px;
            margin: 15px auto;
            padding: 10px;
            background-color: white;
            border: 1px solid lightgray;
            cursor: pointer;
            text-align: left;
        }

        .seleccionado{
            border: 3px solid blue;
        }

        input{
            width: 200px;
            padding: 10px;
            margin-top: 20px;
        }

        button{
            padding: 10px 20px;
            background-color: #1e88e5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background-color: #1565c0;
        }

        #texto{
            color: blue;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div id="contenedor">

        <h2>Lista de tareas:</h2>

        <ul>

            <li id="elemento1" onclick="seleccionar('elemento1')">Estudiar JavaScript</li>
            <li id="elemento2" onclick="seleccionar('elemento2')">Practicar DOM</li>
            <li id="elemento3" onclick="seleccionar('elemento3')">Hacer ejercicios</li>

        </ul>

        <p id="texto">Ningún elemento seleccionado</p>
    </div>

    <br>
    <input type="text" id="nuevocolor" placeholder="Ingrese un color">
    <button onclick="cambiarColor()"> Cambiar color fondo</button>
    <script src="script.js"></script>

</body>
</html>
