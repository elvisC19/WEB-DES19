<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <label for="a">a =</label>
    <input type="number" id="a" name="a" placeholder="a">
    <label for="x2"> x^2</label>
    <br>
    <label for="b">b =</label>
    <input type="number" id="b" name="b" placeholder="b">
    <label for="x">x</label>
    <br>
    <label for="c">c =</label>
    <input type="number"  id="c" name="c" placeholder="c">
    <label for="c"> =! 0</label>
    <br>

    <button onclick="calcular()">Calcular</button>
    <br>
    <label for="x1">x1 </label>
    <input type="text" id="x1"   name="x1" placeholder="x1" readonly>
    <br>
    <label for="x2">x2 </label>
    <input type="text" id="x2" name="x2" placeholder="x2" readonly>


    <script>

        function calcular(){
            a = document.getElementById("a").value;
            b = document.getElementById("b").value;
            c = document.getElementById("c").value;

            discriminante = Math.pow(b,2)-4*a*c;
            sufijo = "";

            if(discriminante < 0){

                discriminante*=-1;
                console.log(discriminante);

                sufijo = "i"
                x1 = -b/(2*a) +"+"+Math.round( Math.sqrt(discriminante))+sufijo;
                x2 =  -b/(2*a) +"+"-Math.round( Math.sqrt(discriminante))+sufijo;


            }else{
                sufijo = "";
                x1 = (-b + Math.sqrt(discriminante))/2*a+sufijo;
                x2 = (-b - Math.sqrt(discriminante))/2*a+sufijo;
            }

            

           document.getElementById("x1").value=x1;
           document.getElementById("x2").value = x2;

           if (sufijo =="i"){
            document.getElementById("x1").style.color = "red";
            document.getElementById("x2").style.color = "red";
           }else{
            document.getElementById("x1").style.color = "black";
            document.getElementById("x2").style.color = "black";
           }
            
        }



    </script>
</body>
</html>
